name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      # La rama de trabajo de la sesión; puedes borrar estas dos líneas al mergear.
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Activa Pages la primera vez (si ya lo está, GitHub responde 409 y seguimos)
      - name: Activar GitHub Pages
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Respuesta de la API de Pages: HTTP $code (409 = ya estaba activado)"
          cat /tmp/pages.json

      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app
        run: npm run build
        env:
          # GitHub Pages sirve el repo en https://<usuario>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
